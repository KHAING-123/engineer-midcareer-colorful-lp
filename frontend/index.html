<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PREAI 採用サイト｜未経験・若手エンジニア募集</title>
    <meta name="description" content="未経験・若手からエンジニアを目指せるPREAIの採用LP。研修・メンター制度・キャリアサポートで成長を支えます。" />
    <script>
      /* Scroll Reveal：Vue 起動前から隠しておき、表示のちらつきを防ぐ。
         動きを減らす設定では付けない／Vue が起動しなかった場合は 3 秒後に全表示へ戻す。 */
      (function () {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
        var root = document.documentElement
        root.classList.add('reveal-ready')
        setTimeout(function () {
          if (!window.__revealReady) root.classList.remove('reveal-ready')
        }, 3000)
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
